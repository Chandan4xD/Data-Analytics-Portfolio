services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: ct
      POSTGRES_DB: control_tower
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d control_tower"]
      interval: 5s
      retries: 10

  airflow:
    build: ./airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src
      CT_DSN: postgresql://ct:ct@db:5432/control_tower
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    depends_on:
      db:
        condition: service_healthy

  superset:
    build: ./superset
    command: >
      /bin/sh -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true;
      superset init && superset run -h 0.0.0.0 -p 8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-local-demo-only}
    ports: ["8088:8088"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
